name: Docs

on:
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "scripts/**"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links point at files that exist
        run: |
          status=0
          for f in $(git ls-files '*.md'); do
            dir=$(dirname "$f")
            for target in $(grep -oE '\]\([^) ]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/#.*$//'); do
              case "$target" in ''|http*|mailto:*) continue ;; esac
              if [ ! -e "$dir/$target" ] && [ ! -e "$target" ]; then
                echo "$f -> $target is missing"; status=1
              fi
            done
          done
          exit $status

      - name: Scripts parse
        run: for s in scripts/*.mjs; do node --check "$s"; done
