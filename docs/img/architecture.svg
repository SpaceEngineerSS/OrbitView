<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Instrument Sans, Segoe UI, system-ui, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #d9dce5; stroke-width: 1.2; }
    .ext { fill: #f4f5f8; stroke: #d9dce5; stroke-width: 1.2; }
    .t { font-size: 15px; font-weight: 600; fill: #101218; }
    .s { font-size: 12.5px; fill: #636878; }
    .lbl { font-size: 11.5px; fill: #3466f2; font-weight: 600; }
    .arrow { stroke: #3466f2; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .dash { stroke: #9a9eab; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; marker-end: url(#g); }
    .zone { font-size: 12px; font-weight: 600; fill: #9a9eab; letter-spacing: .02em; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3466f2"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9a9eab"/></marker>
  </defs>
  <rect width="960" height="470" fill="#eef0f5"/>

  <!-- zones -->
  <text class="zone" x="24" y="30">OUTSIDE</text>
  <text class="zone" x="24" y="160">VERCEL</text>
  <text class="zone" x="24" y="290">BROWSER</text>
  <line x1="24" y1="140" x2="936" y2="140" stroke="#d9dce5"/>
  <line x1="24" y1="270" x2="936" y2="270" stroke="#d9dce5"/>

  <!-- outside -->
  <rect class="ext" x="110" y="46" width="200" height="66" rx="14"/>
  <text class="t" x="128" y="74">Space-Track.org</text>
  <text class="s" x="128" y="95">GP catalog, needs an account</text>
  <rect class="ext" x="340" y="46" width="200" height="66" rx="14"/>
  <text class="t" x="358" y="74">CelesTrak</text>
  <text class="s" x="358" y="95">stations, active, starlink…</text>
  <rect class="ext" x="600" y="46" width="150" height="66" rx="14"/>
  <text class="t" x="618" y="74">NOAA SWPC</text>
  <text class="s" x="618" y="95">F10.7, Kp</text>
  <rect class="ext" x="776" y="46" width="160" height="66" rx="14"/>
  <text class="t" x="794" y="74">Esri tiles</text>
  <text class="s" x="794" y="95">imagery, dark map</text>

  <!-- server -->
  <rect class="box" x="180" y="166" width="300" height="84" rx="14"/>
  <text class="t" x="198" y="194">/api/tle  (route handler)</text>
  <text class="s" x="198" y="216">timeouts · per-group cache 2 h · stale flag</text>
  <text class="s" x="198" y="234">CDN s-maxage, negative cache on failure</text>
  <path class="arrow" d="M210 112 L250 166"/>
  <path class="arrow" d="M440 112 L400 166"/>

  <!-- browser -->
  <rect class="box" x="110" y="300" width="230" height="140" rx="14"/>
  <text class="t" x="128" y="328">Main thread</text>
  <text class="s" x="128" y="350">tle.ts + IndexedDB cache</text>
  <text class="s" x="128" y="368">zustand stores</text>
  <text class="s" x="128" y="386">cards: passes, Doppler, orbit…</text>
  <text class="s" x="128" y="404">selected object: SGP4 at 1 Hz</text>
  <text class="s" x="128" y="422">(exact velocity, look angles)</text>

  <rect class="box" x="400" y="300" width="230" height="140" rx="14"/>
  <text class="t" x="418" y="328">Web Worker</text>
  <text class="s" x="418" y="350">SGP4 for the whole catalog</text>
  <text class="s" x="418" y="368">Float32Array, buffer reused</text>
  <text class="s" x="418" y="386">pass search (bisect + golden)</text>
  <text class="s" x="418" y="404">close-approach screening</text>
  <text class="s" x="418" y="422">generation counter</text>

  <rect class="box" x="690" y="300" width="246" height="140" rx="14"/>
  <text class="t" x="708" y="328">CesiumJS viewer</text>
  <text class="s" x="708" y="350">clock = simulation master</text>
  <text class="s" x="708" y="368">PointPrimitiveCollection</text>
  <text class="s" x="708" y="386">orbit ring, ground track,</text>
  <text class="s" x="708" y="404">coverage circle</text>
  <text class="s" x="708" y="422">no Resium, one viewer</text>

  <path class="arrow" d="M300 250 L250 300"/>
  <text class="lbl" x="285" y="285">TLE text</text>
  <path class="arrow" d="M340 344 L400 344"/>
  <text class="lbl" x="346" y="336">catalog</text>
  <path class="arrow" d="M630 372 L690 372"/>
  <text class="lbl" x="636" y="364">positions</text>
  <path class="arrow" d="M400 396 L340 396"/>
  <text class="lbl" x="346" y="414">passes</text>
  <path class="dash" d="M675 112 L245 300"/>
  <path class="dash" d="M856 112 L813 300"/>
</svg>
